<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #f4f7f6; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            width: 90%; 
            max-width: 400px; 
        }
        .form-control { border-radius: 12px; padding: 12px 15px; }
        .btn-login { 
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); 
            color: white; 
            border-radius: 12px; 
            padding: 12px; 
            font-weight: bold; 
            width: 100%; 
            transition: all 0.3s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(78, 67, 118, 0.3); color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3.5rem;"></i>
            <h3 class="mt-2 fw-bold text-dark">لوحة الإدارة</h3>
            <p class="text-muted small">تسجيل الدخول للمشرفين فقط</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger text-center shadow-sm rounded-3 py-2"><i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold text-muted small">اسم المستخدم</label>
                <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم..." required autofocus>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label fw-semibold text-muted small">كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور..." required>
            </div>
            <button type="submit" class="btn btn-login shadow-sm">دخول</button>
        </form>
        <div class="text-center mt-4">
            <a href="/" class="text-decoration-none text-muted small"><i class="bi bi-arrow-right-short fs-5 align-middle"></i> العودة لصفحة الطلاب</a>
        </div>
    </div>
</body>
</html>
