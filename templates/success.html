<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم التسجيل بنجاح</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .success-card { 
            background: white; 
            padding: 50px 30px; 
            border-radius: 25px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            max-width: 500px; 
            width: 90%; 
            border-top: 8px solid #28a745;
        }
        .check-icon { 
            font-size: 90px; 
            color: #28a745; 
            margin-bottom: 20px; 
            display: inline-block;
            animation: scaleIn 0.5s ease-in-out;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="success-card">
        <i class="bi bi-check-circle-fill check-icon"></i>
        <h2 class="fw-bold text-success mb-3">تم تسجيل الفريق بنجاح!</h2>
        <p class="text-muted fs-5 mb-5">شكراً لكم.. تم حفظ بيانات الفريق واختيار المشروع بشكل مؤكد، بالتوفيق إن شاء الله.</p>
        <a href="/" class="btn btn-outline-success btn-lg px-5 py-2 rounded-pill fw-bold shadow-sm">
            العودة للصفحة الرئيسية
        </a>
    </div>
</body>
</html>
