<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Systems Design G (A) - Dr. Dinaa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; color: #333; }
        .main-card { border-radius: 20px; border: none; }
        .header-gradient { background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); }
        .form-control, .form-select { border-radius: 12px; padding: 12px 15px; border: 1px solid #dce1e5; background-color: #fbfdff; }
        .form-control:focus, .form-select:focus { box-shadow: 0 0 0 0.25rem rgba(78, 67, 118, 0.25); border-color: #4e4376; }
        .member-row { background: #fff; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #edf1f5; }
        .member-badge { background-color: #4e4376; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; display: inline-block; }
        .btn-submit { border-radius: 12px; padding: 15px; font-size: 1.25rem; font-weight: bold; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border: none; color: white; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(17, 153, 142, 0.3); color: white; }
        .admin-btn { border: 2px solid rgba(255,255,255,0.7); color: white; padding: 8px 25px; border-radius: 25px; text-decoration: none; display: inline-block; font-size: 1rem; transition: all 0.3s; background: rgba(255,255,255,0.1); }
        .admin-btn:hover { background: rgba(255,255,255,0.25); color: white; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container mt-4 mb-5">
        <div class="card shadow-lg main-card">
            <div class="card-header header-gradient text-white text-center py-4 px-3">
                <h2 class="fw-bold mb-2">تسجيل مشاريع المادة</h2>
                <h5 class="mb-1 text-light">Interactive Systems Design G (A)</h5>
                <div class="mt-3 mb-3">
                    <a href="/admin" class="admin-btn">
                        <i class="bi bi-person-circle me-1"></i> بإشراف: Dr. Dinaa
                    </a>
                </div>
                <a href="https://youtube.com/playlist?list=PLw6Y5u47CYq47oDw63bMqkq06fjuoK_GJ" target="_blank" class="btn btn-light btn-sm fw-bold rounded-pill px-4 shadow-sm text-dark">
                    <i class="bi bi-play-circle-fill text-danger me-1"></i> مشاهدة قائمة الفيديوهات
                </a>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST">
                    <div class="mb-5 bg-white p-4 rounded-4 shadow-sm border" style="border-color:#edf1f5 !important;">
                        <label class="form-label fw-bold fs-5 text-dark mb-3"><i class="bi bi-book-half me-2 text-primary"></i>اختر الموضوع المراد تطبيقه:</label>
                        <select name="topic_id" class="form-select form-select-lg" required>
                            <option value="">-- اضغط هنا لاختيار الموضوع --</option>
                            {%- for t in topics %}
                            <option value="{{ t.id }}" {% if t.is_full %}disabled{% endif %}>{% if t.is_full %}🔒 مكتمل - {{ t.name }}{% else %}{{ t.name }} {% if t.desc %}({{ t.desc }}){% endif %}{% if t.count > 0 %} 🔴 (مُسجل به {{ t.count }} من أصل {{ t.max_teams }} فرق){% endif %}{% endif %}</option>
                            {%- endfor %}
                        </select>
                    </div>
                    <div class="mb-4">
                        <h5 class="fw-bold text-dark m-0"><i class="bi bi-people-fill me-2 text-primary"></i>بيانات أعضاء الفريق</h5>
                    </div>
                    {%- for i in range(1, 6) %}
                    <div class="member-row">
                        <div class="member-badge">الطالب رقم {{ i }}</div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-muted small">الاسم الرباعي</label>
                                <input type="text" name="name{{ i }}" class="form-control" placeholder="..." {% if i <= 3 %}required{% endif %}>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-muted small">الرقم الجامعي / ID</label>
                                <input type="text" name="id{{ i }}" class="form-control" placeholder="..." {% if i <= 3 %}required{% endif %}>
                            </div>
                        </div>
                    </div>
                    {%- endfor %}
                    <button type="submit" class="btn btn-submit w-100 shadow-sm mt-3">
                        <i class="bi bi-check-circle-fill me-2"></i> تأكيد وتسجيل بيانات الفريق
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
